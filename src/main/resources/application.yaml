spring:

  application:
    name: event-driven-notification-service

  datasource:
    url: jdbc:postgresql://localhost:5432/event-driven-notification
    username: postgres
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  kafka:
    bootstrap-servers: localhost:9092

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info