<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
<title id="t">Event-driven notification architecture</title><desc id="d">Transactional outbox publishes to Kafka, idempotent consumers process events with retries and dead letter topics.</desc>
<defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#07131a"/><stop offset="1" stop-color="#0f172a"/></linearGradient></defs>
<rect width="1200" height="420" rx="24" fill="url(#g)"/><text x="55" y="55" fill="#f8fafc" font-size="25" font-family="Arial" font-weight="700">Reliable Event Publication & Recovery</text><text x="55" y="82" fill="#94a3b8" font-size="14" font-family="Arial">Database state and event publication move together; consumer failure remains recoverable.</text>
<g font-family="Arial" font-size="15" text-anchor="middle"><g fill="#0f172a" stroke="#22c55e" stroke-width="2"><rect x="35" y="145" width="155" height="95" rx="16"/><rect x="220" y="145" width="180" height="95" rx="16"/><rect x="430" y="145" width="160" height="95" rx="16"/><rect x="620" y="145" width="180" height="95" rx="16"/><rect x="830" y="145" width="155" height="95" rx="16"/><rect x="1015" y="145" width="150" height="95" rx="16"/></g>
<text x="112" y="183" fill="#86efac" font-weight="700">REST API</text><text x="112" y="207" fill="#cbd5e1">business change</text>
<text x="310" y="183" fill="#86efac" font-weight="700">Outbox</text><text x="310" y="207" fill="#cbd5e1">same transaction</text>
<text x="510" y="183" fill="#86efac" font-weight="700">Publisher</text><text x="510" y="207" fill="#cbd5e1">reliable handoff</text>
<text x="710" y="183" fill="#86efac" font-weight="700">Kafka</text><text x="710" y="207" fill="#cbd5e1">event backbone</text>
<text x="907" y="183" fill="#86efac" font-weight="700">Consumers</text><text x="907" y="207" fill="#cbd5e1">idempotent handlers</text>
<text x="1090" y="183" fill="#86efac" font-weight="700">DLT</text><text x="1090" y="207" fill="#cbd5e1">recover failures</text></g>
<g stroke="#64748b" stroke-width="3"><path d="M190 193h30"/><path d="M400 193h30"/><path d="M590 193h30"/><path d="M800 193h30"/><path d="M985 193h30"/></g>
<text x="600" y="300" text-anchor="middle" fill="#38bdf8" font-size="18" font-family="Arial" font-weight="700">Failure behavior</text><text x="600" y="328" text-anchor="middle" fill="#cbd5e1" font-size="14" font-family="Arial">retryable failure → retry topic → bounded attempts → Dead Letter Topic</text>
